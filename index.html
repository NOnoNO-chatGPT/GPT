<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Strike Mobile — Ultimate</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080e14;color:#f3f6f8;font-family:Arial,sans-serif;touch-action:none}button{background:#263744;color:#fff;border:1px solid #ffffff35;border-radius:10px;padding:11px 14px;font-weight:700}button:active{filter:brightness(1.3)}#scene{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;gap:8px}.pill{background:#101b25d9;border:1px solid #ffffff30;border-radius:10px;padding:8px 12px;font-weight:bold;text-shadow:0 2px 3px #000}#cross{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;color:#fff9;pointer-events:none}#controls{position:fixed;inset:auto 12px 12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad,.actions{pointer-events:auto}.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px}.pad button{padding:0;font-size:20px}.actions{display:flex;flex-direction:column;gap:6px;align-items:end}.actions button{min-width:92px}.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#0a121bdc,#101c28f2);overflow:auto}.panel{width:min(920px,100%);max-height:94vh;overflow:auto;background:#14212c;border:1px solid #ffffff35;border-radius:18px;padding:20px;box-shadow:0 20px 80px #000b}.hidden{display:none!important}h1{font-size:clamp(25px,5vw,42px);margin:0 0 6px;letter-spacing:2px}h2{margin:0 0 12px}.muted{color:#b6c4ce}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button.active{background:#a86e32}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.card{background:#22323e;border:1px solid #ffffff26;border-radius:13px;padding:12px;text-align:center}.art{height:90px;border-radius:9px;margin:8px 0;background:radial-gradient(circle at 50% 30%,#657985,#17232d 72%);display:flex;align-items:center;justify-content:center}.art svg{width:96%;height:90%;filter:drop-shadow(0 8px 5px #0009)}.tag{font-size:12px;color:#b9c8d2}.wide{width:100%}#result{position:fixed;inset:0;z-index:10;background:#03080eef;display:flex;align-items:center;justify-content:center;padding:16px}#result .panel{text-align:center;width:min(420px,100%)}#lookHint{position:fixed;top:55px;left:50%;transform:translateX(-50%);font-size:12px;color:#dbe5eb;background:#101b25a8;padding:5px 9px;border-radius:8px;pointer-events:none}
@media(orientation:portrait){#controls{bottom:8px}.pill{font-size:12px;padding:7px} .actions button{min-width:78px;padding:9px;font-size:12px}}
</style></head><body>
<div id="scene"></div><div id="hud" class="hidden"><div class="pill">❤️ <span id="hp">100</span>　🔫 <span id="ammo">30</span>/90</div><div class="pill">🪙 <span id="coinHud">0</span></div></div><div id="cross" class="hidden">+</div><div id="lookHint" class="hidden">Свайп по экрану — обзор вверх / вниз / в стороны</div>
<div id="controls" class="hidden"><div class="pad"><span></span><button data-key="forward">▲</button><span></span><button data-key="left">◀</button><button data-key="back">▼</button><button data-key="right">▶</button><span></span><button id="jump">↟</button><span></span></div><div class="actions"><button id="fire">ОГОНЬ</button><button id="reload">ПЕРЕЗАРЯДКА</button><button id="inspect">ОСМОТР</button><button id="shopInGame">МАГАЗИН</button><button id="backMenu">МЕНЮ</button></div></div>
<div id="main" class="screen"><div class="panel"><div class="bar"><div><div class="tag">TACTICAL FPS • MOBILE</div><h1>STRIKE MOBILE</h1><p class="muted">Выбирай экипировку, открывай кейсы и выходи на карту.</p></div><div class="pill">🪙 <b id="mainCoins">0</b></div></div><div class="tabs"><button data-page="play" class="active">ИГРАТЬ</button><button data-page="inventory">ИНВЕНТАРЬ</button><button data-page="cases">КЕЙСЫ</button><button data-page="maps">КАРТЫ</button><button data-page="modes">РЕЖИМЫ</button></div><div id="content"></div></div></div>
<div id="shop" class="screen hidden"><div class="panel"><div class="bar"><h2>МАГАЗИН В МАТЧЕ</h2><b>🪙 <span id="shopCoins">0</span></b></div><div class="grid" id="shopItems"></div><button class="wide" id="closeShop">ЗАКРЫТЬ</button></div></div>
<div id="inspectScreen" class="screen hidden"><div class="panel" style="text-align:center"><h2>ОСМОТР ПРЕДМЕТА</h2><div id="inspectArt" class="art" style="height:220px"></div><h3 id="inspectName"></h3><p class="muted">Поверни модель свайпом или мышью.</p><button id="closeInspect">ГОТОВО</button></div></div>
<div id="result" class="hidden"><div class="panel"><h1 id="resultTitle">РАУНД ЗАВЕРШЁН</h1><p id="resultText"></p><button id="resultAgain">ЕЩЁ РАУНД</button><button id="resultMenu">В МЕНЮ</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);
const skins=[
{name:'Crimson Web',kind:'AK-47',color:0xb72d3c,knife:false},{name:'Neon Tiger',kind:'M4',color:0xe59b16,knife:false},{name:'Frostbite',kind:'AWP',color:0x75c5e6,knife:false},{name:'Gold Rush',kind:'Desert Eagle',color:0xd2aa35,knife:false},{name:'Toxic Grid',kind:'M4',color:0x83b52b,knife:false},
{name:'Керамбит | Сапфир',kind:'Керамбит',color:0x36b9e8,knife:true},{name:'Керамбит | Рубин',kind:'Керамбит',color:0xd32d4b,knife:true},{name:'Керамбит | Изумруд',kind:'Керамбит',color:0x38bb7b,knife:true},{name:'Нож-бабочка | Градиент',kind:'Нож-бабочка',color:0xb878dc,knife:true}
];
const state={coins:Number(localStorage.getItem('smCoins')||500),owned:JSON.parse(localStorage.getItem('smOwned')||'["Standard"]'),equipped:localStorage.getItem('smEquipped')||'Standard',map:localStorage.getItem('smMap')||'Dust 2',mode:localStorage.getItem('smMode')||'Deathmatch',health:100,ammo:30,reserve:90,kills:0,boost:0,weapon:'AK-47'};
const save=()=>{localStorage.setItem('smCoins',state.coins);localStorage.setItem('smOwned',JSON.stringify(state.owned));localStorage.setItem('smEquipped',state.equipped);localStorage.setItem('smMap',state.map);localStorage.setItem('smMode',state.mode)};
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('scene').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91a9b6);scene.fog=new THREE.Fog(0x91a9b6,17,42);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);camera.position.set(0,1.65,5);scene.add(camera);
scene.add(new THREE.HemisphereLight(0xcde4ff,0x534333,2));const sun=new THREE.DirectionalLight(0xffe2bd,2.5);sun.position.set(-5,12,7);sun.castShadow=true;scene.add(sun);
const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const mats={wall:mat(0xb9a88d),floor:mat(0x77756b),blue:mat(0x263e54),pants:mat(0x26343b),skin:mat(0xb98261),black:mat(0x151a1f),metal:mat(0x69747c,.35,.8),wood:mat(0x65432b),vest:mat(0x394b45),glove:mat(0x242d31)};
let world=[],bots=[],weaponGroup=null,active=false,lookX=0,lookY=0,drag=null,keys={},pitch=0,velY=0,playerY=1.65,roundTimer=0;
function box(parent,w,h,d,material,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function clearWorld(){for(const o of world)scene.remove(o);world=[];bots.forEach(b=>scene.remove(b));bots=[]}
function buildMap(){clearWorld();let floor=box(scene,38,.3,38,mats.floor,0,-.18,0);world.push(floor);
const mapName=state.map;const wallMat=mapName==='Mirage'?mat(0xc5a879):mapName==='Factory'?mat(0x59636a):mat(0xb6a184);
for(let i=-17;i<=17;i+=4){world.push(box(scene,3,3,1.1,wallMat,i,1.35,-12));world.push(box(scene,1.1,3,3,wallMat,-12,1.35,i));world.push(box(scene,3,3,1.1,wallMat,i,1.35,12));world.push(box(scene,1.1,3,3,wallMat,12,1.35,i))}
for(let i=0;i<9;i++){let x=(Math.random()-.5)*20,z=(Math.random()-.5)*20;if(Math.abs(x)<3&&Math.abs(z)<3)continue;let cover=box(scene,1.6,1.5,1.6,mapName==='Mirage'?mat(0x9b784f):mat(0x59646a),x,.65,z);world.push(cover)}
// Map identity markers and bomb sites
for(const [x,z,col] of [[-7,-7,0xd9b34e],[7,7,0x4a8ec2]]){const pad=new THREE.Mesh(new THREE.CylinderGeometry(2,2,.12,32),mat(col));pad.position.set(x,.02,z);scene.add(pad);world.push(pad)}
camera.position.set(0,1.65,8);camera.rotation.set(0,0,0);pitch=0;spawnBots()}
function makeBot(x,z){const g=new THREE.Group();const body=box(g,.72,.9,.4,mats.vest,0,1.25,0);box(g,.48,.5,.48,mats.skin,0,2,0);box(g,.55,.22,.55,mats.black,0,2.34,0);box(g,.8,.16,.46,mats.blue,0,1.65,0);
for(const side of [-1,1]){const arm=box(g,.22,.78,.24,mats.blue,side*.52,1.25,0);arm.userData.swing=side;box(g,.24,.8,.25,mats.pants,side*.23,.42,0)}
g.position.set(x,0,z);g.userData={hp:100,alive:true,phase:Math.random()*6};scene.add(g);bots.push(g)}
function spawnBots(){for(let i=0;i<8;i++)makeBot((Math.random()-.5)*18,(Math.random()-.5)*18)}
function makeWeapon(){if(weaponGroup)camera.remove(weaponGroup);weaponGroup=new THREE.Group();const isKnife=state.equipped.includes('Керамбит')||state.equipped.includes('Нож-бабочка');let tint=skins.find(s=>s.name===state.equipped)?.color||0x6b7479;const skinMat=mat(tint,.35,.45);if(isKnife){const blade=new THREE.Mesh(new THREE.ConeGeometry(.12,.95,5),skinMat);blade.rotation.z=-Math.PI/2;blade.position.set(.3,-.13,-.75);weaponGroup.add(blade);box(weaponGroup,.18,.16,.45,mats.black,.78,-.13,-.75);const ring=new THREE.Mesh(new THREE.TorusGeometry(.12,.035,8,20),mats.metal);ring.position.set(.9,-.13,-.75);weaponGroup.add(ring)}else{box(weaponGroup,.22,.22,.95,skinMat,.28,-.12,-.8);box(weaponGroup,.13,.13,.72,mats.metal,.28,-.03,-1.5);box(weaponGroup,.2,.42,.25,mats.black,.3,-.4,-.67);box(weaponGroup,.16,.42,.25,mats.wood,.1,-.4,-.9);box(weaponGroup,.72,.16,.16,mats.glove,.05,-.48,-.62);box(weaponGroup,.42,.15,.15,mats.glove,.55,-.47,-.95)}camera.add(weaponGroup);weaponGroup.position.set(.48,-.42,-.75)}
function equip(name){state.equipped=name;save();makeWeapon()}
function render(){requestAnimationFrame(render);const t=performance.now()*.001;if(active){let move=0,strafe=0;if(keys.forward||keys.w)move=1;if(keys.back||keys.s)move=-1;if(keys.left||keys.a)strafe=-1;if(keys.right||keys.d)strafe=1;const speed=.075;camera.position.x+=(-Math.sin(camera.rotation.y)*move+Math.cos(camera.rotation.y)*strafe)*speed;camera.position.z+=(-Math.cos(camera.rotation.y)*move-Math.sin(camera.rotation.y)*strafe)*speed;camera.position.y=playerY;bots.forEach((b,i)=>{if(!b.userData.alive)return;b.position.y=Math.abs(Math.sin(t*5+b.userData.phase))*.04;b.rotation.y=Math.sin(t*.7+i)*.35});if(weaponGroup)weaponGroup.position.y=-.42+Math.sin(t*8)*(move||strafe?.012: .003)}renderer.render(scene,camera)}
render();
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
function weaponSvg(color,knife=false){return knife?`<svg viewBox="0 0 300 100"><path d="M25 57Q105 8 245 25Q205 70 70 68Z" fill="${color}" stroke="#111" stroke-width="5"/><path d="M25 50L68 65L50 88Q20 83 15 64Z" fill="#202830"/><circle cx="28" cy="67" r="9" fill="none" stroke="#cbd3d8" stroke-width="5"/></svg>`:`<svg viewBox="0 0 300 100"><path d="M12 38H72L93 48H240V39H286V58H240L220 68H110L80 57H12Z" fill="${color}" stroke="#111" stroke-width="5"/><path d="M116 64h32l-5 31h-22z" fill="#242a30"/><path d="M185 65h25l-5 28h-17z" fill="#614329"/></svg>`}
function colorHex(n){return '#'+n.toString(16).padStart(6,'0')}
function content(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const el=$('content');
if(page==='play')el.innerHTML=`<h2>БЫСТРАЯ ИГРА</h2><p class="muted">Карта: <b>${state.map}</b> · Режим: <b>${state.mode}</b></p><p>За каждое убийство начисляется <b>50 монет</b>. Выбери карту и режим в соседних вкладках.</p><button id="startMatch">ИГРАТЬ</button>`;
if(page==='inventory')el.innerHTML=`<h2>ИНВЕНТАРЬ</h2><p class="muted">Выбран предмет: ${state.equipped}</p><div class="grid">${state.owned.map(n=>{let d=skins.find(s=>s.name===n),co=d?colorHex(d.color):'#8b969d';return `<div class="card"><div class="art">${weaponSvg(co,!!d?.knife)}</div><b>${n}</b><p class="tag">${d?.kind||'Стандартное оружие'}</p><button data-equip="${n}">${state.equipped===n?'ЭКИПИРОВАНО':'ЭКИПИРОВАТЬ'}</button><button data-inspect="${n}">ОСМОТР</button></div>`}).join('')}</div>`;
if(page==='cases')el.innerHTML=`<h2>КЕЙСЫ</h2><p class="muted">Каждый кейс стоит 100 монет. Содержимое видно заранее.</p><div class="grid"><div class="card"><div class="art">${weaponSvg('#d99b39')}</div><h3>АРСЕНАЛ</h3><p class="tag">Crimson Web · Neon Tiger · Frostbite · Gold Rush · Toxic Grid</p><button data-case="weapon">ОТКРЫТЬ · 100 🪙</button></div><div class="card"><div class="art">${weaponSvg('#43bce8',true)}</div><h3>ОХОТА ЗА НОЖАМИ</h3><p class="tag">Керамбит Сапфир / Рубин / Изумруд, нож-бабочка</p><button data-case="knife">ОТКРЫТЬ · 100 🪙</button></div></div><h3>Предметы внутри</h3><div class="grid">${skins.map(d=>`<div class="card"><div class="art">${weaponSvg(colorHex(d.color),d.knife)}</div><b>${d.name}</b><p class="tag">${d.kind}</p></div>`).join('')}</div>`;
if(page==='maps')el.innerHTML=`<h2>КАРТЫ</h2><div class="grid">${['Dust 2','Mirage','Factory'].map(m=>`<div class="card"><div class="art" style="background:linear-gradient(140deg,${m==='Mirage'?'#b99b72,#4b5d5b':m==='Factory'?'#66727b,#202a32':'#c2a477,#635d50'})">🗺️</div><h3>${m}</h3><button data-map="${m}">${state.map===m?'ВЫБРАНА':'ВЫБРАТЬ'}</button></div>`).join('')}</div>`;
if(page==='modes')el.innerHTML=`<h2>РЕЖИМЫ</h2><div class="grid">${['Deathmatch','Закладка бомбы'].map(m=>`<div class="card"><h3>${m}</h3><p class="tag">${m==='Deathmatch'?'Командный бой с возрождением':'Установка и обезвреживание бомбы (демо-режим)'}</p><button data-mode="${m}">${state.mode===m?'ВЫБРАН':'ВЫБРАТЬ'}</button></div>`).join('')}</div>`}
function refreshCoins(){['mainCoins','coinHud','shopCoins'].forEach(id=>{if($(id))$(id).textContent=state.coins})}
function start(){ $('main').classList.add('hidden');$('result').classList.add('hidden');$('hud').classList.remove('hidden');$('cross').classList.remove('hidden');$('controls').classList.remove('hidden');$('lookHint').classList.remove('hidden');state.health=100;state.ammo=30;state.reserve=90;state.kills=0;active=true;buildMap();makeWeapon();refreshCoins();$('hp').textContent=state.health;$('ammo').textContent=state.ammo}
function stopToMenu() {active=false;$('controls').classList.add('hidden');$('hud').classList.add('hidden');$('cross').classList.add('hidden');$('lookHint').classList.add('hidden');$('main').classList.remove('hidden');content('play')}
function showInspect(name){const d=skins.find(s=>s.name===name);$('inspectName').textContent=name;$('inspectArt').innerHTML=weaponSvg(d?colorHex(d.color):'#8c989e',!!d?.knife);$('inspectScreen').classList.remove('hidden')}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>content(b.dataset.page));$('content').addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.id==='startMatch'){start();return}if(b.dataset.map){state.map=b.dataset.map;save();content('maps')}if(b.dataset.mode){state.mode=b.dataset.mode;save();content('modes')}if(b.dataset.equip){equip(b.dataset.equip);content('inventory')}if(b.dataset.inspect)showInspect(b.dataset.inspect);if(b.dataset.case){if(state.coins<100){alert('Нужно 100 монет');return}let pool=skins.filter(s=>b.dataset.case==='knife'?s.knife:!s.knife);let got=pool[Math.floor(Math.random()*pool.length)];state.coins-=100;if(!state.owned.includes(got.name))state.owned.push(got.name);save();refreshCoins();alert('Выпало: '+got.name+' — '+got.kind);content('cases')}});
$('closeInspect').onclick=()=>$('inspectScreen').classList.add('hidden');
$('fire').onclick=()=>{if(!active||state.ammo<=0)return;state.ammo--;let alive=bots.filter(b=>b.userData.alive);let target=alive.find(b=>{let v=new THREE.Vector3();b.getWorldPosition(v);v.project(camera);return Math.abs(v.x)<.12&&Math.abs(v.y)<.15&&v.z<1});if(target){target.userData.hp-=40;if(target.userData.hp<=0){target.userData.alive=false;scene.remove(target);state.kills++;state.coins+=50;save();refreshCoins()}}$('ammo').textContent=state.ammo};
$('reload').onclick=()=>{let n=Math.min(30-state.ammo,state.reserve);state.ammo+=n;state.reserve-=n;$('ammo').textContent=state.ammo};
$('inspect').onclick=()=>showInspect(state.equipped);$('backMenu').onclick=stopToMenu;$('resultMenu').onclick=stopToMenu;$('resultAgain').onclick=start;
$('shopInGame').onclick=()=>{$('shopCoins').textContent=state.coins;$('shopItems').innerHTML=[['Патроны +30',25,'ammo'],['Аптечка +40 HP',75,'hp'],['Усиление урона',100,'boost']].map(x=>`<div class="card"><h3>${x[0]}</h3><button data-buy="${x[2]}">${x[1]} 🪙</button></div>`).join('');$('shop').classList.remove('hidden')};
$('shopItems').onclick=e=>{let b=e.target.closest('[data-buy]');if(!b)return;let cost={ammo:25,hp:75,boost:100}[b.dataset.buy];if(state.coins<cost)return;if(b.dataset.buy==='ammo')state.reserve+=30;if(b.dataset.buy==='hp')state.health=Math.min(100,state.health+40);if(b.dataset.buy==='boost')state.boost=10;state.coins-=cost;save();refreshCoins();$('shopCoins').textContent=state.coins;$('hp').textContent=state.health};
$('closeShop').onclick=()=>$('shop').classList.add('hidden');
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();keys[k]=true};b.onpointerup=b.onpointercancel=()=>keys[k]=false});
$('jump').onclick=()=>{playerY=1.95;setTimeout(()=>playerY=1.65,280)};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')$('fire').click();if(e.key.toLowerCase()==='r')$('reload').click()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||!active)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;camera.rotation.order='YXZ';camera.rotation.y-=dx*.005;pitch=Math.max(-1.35,Math.min(1.35,pitch-dy*.005));camera.rotation.x=pitch;drag={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('pointerup',()=>drag=null);
content('play');refreshCoins();
</script></body></html>
